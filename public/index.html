<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariael Cosmetics — Catálogo</title>
<meta name="description" content="Catálogo de productos Mariael Cosmetics. Realza tu belleza, resalta tu esencia.">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://checkout.wompi.co/widget.js"></script>
<style>
:root{
  --blush:#fbeeea;
  --blush-deep:#f6ddd4;
  --card:#fffaf8;
  --rose:#c98a7d;
  --rose-deep:#a8695c;
  --gold:#d4af8c;
  --ink:#2b2320;
  --ink-soft:#5c4f49;
  --line:#e8d3cb;
  --good:#4c7a5d;
  --good-bg:#eaf3ec;
  --bad:#b24a41;
  --shadow: 0 12px 28px -14px rgba(168,105,92,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 8% 0%, var(--blush-deep) 0%, transparent 45%),
    radial-gradient(circle at 100% 15%, var(--blush-deep) 0%, transparent 40%),
    var(--blush);
  font-family:'Poppins', sans-serif;
  color:var(--ink);
  min-height:100vh;
}
::selection{background:var(--rose); color:#fff;}

.hero{
  position:relative;
  text-align:center;
  padding:44px 6vw 30px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
}
.hero img{
  width:96px; height:96px; border-radius:50%; object-fit:cover;
  box-shadow:0 6px 20px rgba(168,105,92,0.35); border:3px solid #fff;
  margin-bottom:14px;
}
.hero .sub{
  font-size:12px; letter-spacing:0.32em; color:var(--rose-deep);
  text-transform:uppercase; font-weight:600;
}
.hero h1{
  font-family:'Playfair Display', serif; font-weight:700; letter-spacing:0.04em;
  font-size:clamp(28px,6vw,42px); margin:6px 0 4px;
}
.hero .tag{
  font-size:13px; color:var(--ink-soft); font-style:italic; letter-spacing:0.02em;
}
.hero .divider{ margin-top:16px; color:var(--rose); font-size:13px; }

/* ---------- CART BUTTON ---------- */
.cart-fab{
  position:fixed; top:20px; right:20px; z-index:60;
  background:linear-gradient(135deg, var(--rose), var(--rose-deep));
  color:#fff; border:none; border-radius:999px;
  width:56px; height:56px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 24px -8px rgba(168,105,92,0.55);
  cursor:pointer; transition:transform .15s ease;
}
.cart-fab:hover{ transform:scale(1.06); }
.cart-fab svg{ width:24px; height:24px; fill:#fff; }
.cart-badge{
  position:absolute; top:-4px; right:-4px;
  background:var(--gold); color:var(--ink);
  font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:999px;
  display:flex; align-items:center; justify-content:center; padding:0 5px;
  border:2px solid var(--blush);
}

.toolbar{
  max-width:1200px; margin:0 auto; padding:26px 6vw 0;
  display:flex; justify-content:center;
}
.search-box{
  width:100%; max-width:420px;
  display:flex; align-items:center; gap:8px;
  background:#fff; border:1px solid var(--line); border-radius:999px;
  padding:12px 18px; box-shadow:var(--shadow);
}
.search-box svg{ width:16px; height:16px; fill:var(--rose-deep); flex-shrink:0; }
.search-box input{
  border:none; outline:none; font-family:'Poppins'; font-size:14px;
  width:100%; background:transparent; color:var(--ink);
}

main{ max-width:1200px; margin:0 auto; padding:28px 6vw 60px; }

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
  gap:20px;
}
.product-card{
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  overflow:hidden; box-shadow:var(--shadow);
  transition:transform .2s ease, box-shadow .2s ease;
  display:flex; flex-direction:column;
}
.product-card:hover{ transform:translateY(-4px); box-shadow:0 18px 34px -14px rgba(168,105,92,0.45); }
.product-img{
  width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--blush-deep);
  display:block;
}
.product-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
.product-name{
  font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.35;
  min-height:2.7em;
}
.product-price{
  margin-top:auto;
  font-family:'Playfair Display', serif; font-weight:700; font-size:19px;
  color:var(--rose-deep);
}
.add-btn{
  margin-top:10px; border:none; border-radius:10px; padding:10px 12px;
  background:linear-gradient(135deg, var(--rose), var(--rose-deep));
  color:#fff; font-family:'Poppins'; font-weight:600; font-size:12.5px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  transition:transform .15s ease;
}
.add-btn:active{ transform:scale(0.96); }
.add-btn svg{ width:14px; height:14px; fill:#fff; }
.qty-stepper{
  margin-top:10px; display:flex; align-items:center; justify-content:space-between;
  background:var(--good-bg); border-radius:10px; padding:6px 10px;
}
.qty-stepper button{
  border:none; background:#fff; color:var(--rose-deep); width:26px; height:26px; border-radius:8px;
  font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.08);
}
.qty-stepper span{ font-weight:700; font-size:13.5px; color:var(--good); }

.empty-state{
  grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--ink-soft);
}
.empty-state .heart{ font-size:26px; color:var(--rose); display:block; margin-bottom:10px; }

footer{
  text-align:center; padding:30px 20px 44px; color:var(--ink-soft); font-size:11.5px;
  letter-spacing:0.05em;
}
footer .heart{ color:var(--rose); }

/* ---------- CART DRAWER ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(43,35,32,0.45);
  display:none; z-index:90; backdrop-filter:blur(2px);
}
.overlay.show{ display:block; }
.drawer{
  position:fixed; top:0; right:0; height:100%; width:100%; max-width:420px;
  background:#fffdfc; z-index:95; box-shadow:-16px 0 40px rgba(43,35,32,0.25);
  transform:translateX(100%); transition:transform .25s ease;
  display:flex; flex-direction:column;
}
.drawer.show{ transform:translateX(0); }
.drawer-header{
  padding:22px 22px 16px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
}
.drawer-header h3{
  font-family:'Playfair Display', serif; margin:0; font-size:20px;
  display:flex; align-items:center; gap:8px;
}
.close-btn{
  border:none; background:var(--blush-deep); color:var(--rose-deep); width:32px; height:32px;
  border-radius:50%; cursor:pointer; font-size:16px; line-height:1;
}
.drawer-body{ flex:1; overflow-y:auto; padding:16px 22px; }
.cart-item{
  display:flex; gap:12px; padding:14px 0; border-bottom:1px solid #f2e4de;
}
.cart-item img{ width:64px; height:64px; border-radius:12px; object-fit:cover; background:var(--blush-deep); flex-shrink:0; }
.cart-item-info{ flex:1; display:flex; flex-direction:column; gap:4px; }
.cart-item-name{ font-size:13px; font-weight:600; line-height:1.3; }
.cart-item-price{ font-size:12.5px; color:var(--rose-deep); font-weight:700; }
.cart-item-controls{ display:flex; align-items:center; gap:8px; margin-top:2px; }
.cart-item-controls button{
  border:none; background:var(--blush-deep); color:var(--rose-deep); width:22px; height:22px;
  border-radius:6px; font-size:13px; font-weight:700; cursor:pointer;
}
.cart-item-controls span{ font-size:12.5px; font-weight:600; min-width:16px; text-align:center; }
.remove-btn{
  border:none; background:transparent; color:var(--bad); cursor:pointer; padding:4px;
  align-self:flex-start;
}
.remove-btn svg{ width:15px; height:15px; fill:currentColor; }
.cart-empty{ text-align:center; padding:50px 10px; color:var(--ink-soft); }
.cart-empty .heart{ font-size:24px; color:var(--rose); display:block; margin-bottom:10px; }

.checkout-fields{ padding:6px 0 16px; display:flex; flex-direction:column; gap:10px; }
.checkout-fields label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-soft);
  font-weight:600; margin-bottom:3px; display:block;
}
.checkout-fields input{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px;
  font-family:'Poppins'; font-size:13px; outline:none; background:#fff; color:var(--ink);
}
.checkout-fields input:focus{ border-color:var(--rose); }

.drawer-footer{
  border-top:1px solid var(--line); padding:16px 22px 22px; background:#fff;
}
.cart-total-row{
  display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;
}
.cart-total-row .label{ font-size:13px; color:var(--ink-soft); font-weight:600; }
.cart-total-row .value{ font-family:'Playfair Display', serif; font-size:24px; font-weight:700; color:var(--ink); }
.pay-btn{
  width:100%; border:none; border-radius:12px; padding:14px;
  background:linear-gradient(135deg, var(--rose), var(--rose-deep));
  color:#fff; font-family:'Poppins'; font-weight:700; font-size:14.5px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 8px 20px -6px rgba(168,105,92,0.6);
}
.pay-btn:disabled{ opacity:0.55; cursor:not-allowed; }
.pay-btn img{ height:16px; }
.pay-hint{ font-size:11px; color:var(--ink-soft); text-align:center; margin-top:10px; line-height:1.5; }

.toast{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:12px 22px; border-radius:999px;
  font-size:13px; opacity:0; pointer-events:none; transition:all .25s ease;
  z-index:200; box-shadow:0 10px 30px rgba(0,0,0,0.25);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:480px){
  .drawer{ max-width:100%; }
}
</style>
</head>
<body>

<button class="cart-fab" id="cartFab" aria-label="Ver carrito">
  <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12L8.1 13h7.45c.75 0 1.41-.41 1.75-1.03L20.88 5H4.54l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
  <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
</button>

<div class="hero">
  <img src="logo.jpg" alt="Mariael Cosmetics">
  <div class="sub">Mariael Cosmetics</div>
  <h1>Catálogo</h1>
  <div class="tag">Realza tu belleza, resalta tu esencia</div>
  <div class="divider">&#9825;</div>
</div>

<div class="toolbar">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="searchInput" type="text" placeholder="Buscar producto...">
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>MARIAEL COSMETICS <span class="heart">&#9825;</span> Santa Marta</footer>

<!-- ================= CART DRAWER ================= -->
<div class="overlay" id="cartOverlay"></div>
<div class="drawer" id="cartDrawer">
  <div class="drawer-header">
    <h3><span style="color:var(--rose)">&#9825;</span> Tu carrito</h3>
    <button class="close-btn" id="closeCart">&#10005;</button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-footer" id="cartFooter" style="display:none;">
    <div class="checkout-fields">
      <div>
        <label>Nombre completo</label>
        <input type="text" id="custName" placeholder="Tu nombre">
      </div>
      <div>
        <label>Teléfono</label>
        <input type="tel" id="custPhone" placeholder="300 000 0000">
      </div>
      <div>
        <label>Correo electrónico</label>
        <input type="email" id="custEmail" placeholder="tucorreo@ejemplo.com">
      </div>
    </div>
    <div class="cart-total-row">
      <span class="label">Total a pagar</span>
      <span class="value" id="cartTotal">$0</span>
    </div>
    <button class="pay-btn" id="payBtn">Pagar con Wompi</button>
    <div class="pay-hint">Pago seguro procesado por Wompi · Tarjetas, PSE, Nequi y más</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ======================================================
   ⚠️ CONFIGURA AQUÍ LOS DATOS DE WOMPI Y TU API DE FIRMA
   - WOMPI_PUBLIC_KEY: tu llave pública (pub_test_ o pub_prod_)
     desde https://comercios.wompi.co > Desarrolladores
   - WOMPI_SIGNATURE_API_URL: la URL de tu función en Vercel que
     genera la firma de integridad, ej:
     'https://mariael-wompi-api.vercel.app/api/wompi-signature'
     Si la dejas vacía, el pago se abre SIN firma de integridad
     (funciona, pero sin esa capa extra de seguridad de Wompi).
====================================================== */
const WOMPI_PUBLIC_KEY = 'pub_test_PiaFqJORtLn0bXNAd52k6swcPOoJwBAb';
const WOMPI_SIGNATURE_API_URL = '/api/wompi-signature';

const PRODUCTS = [{"ref": "10663", "nombre": "Kit De Vitamina C Bioaqua", "precio": 42900.0, "img": "images/10663.jpg"}, {"ref": "10632", "nombre": "Kit De Arroz Bioaqua", "precio": 42900.0, "img": "images/10632.jpg"}, {"ref": "11726", "nombre": "Matificante Elaya", "precio": 24300.0, "img": "images/11726.jpg"}, {"ref": "14057", "nombre": "Agua De Rosas Valan", "precio": 9400.0, "img": "images/14057.jpg"}, {"ref": "14643", "nombre": "Rubor Duo Sagui", "precio": 20400.0, "img": "images/14643.jpg"}, {"ref": "14644", "nombre": "Rubor Duo Sagui", "precio": 20400.0, "img": "images/14644.jpg"}, {"ref": "14248", "nombre": "Mantequilla Corporal Chocovibes Purpure 250 Ml", "precio": 32000.0, "img": "images/14248.jpg"}, {"ref": "13959", "nombre": "Mantequilla Corporal Bubble Gum Purpure 250 Ml", "precio": 32000.0, "img": "images/13959.jpg"}, {"ref": "14325", "nombre": "Set De Pomos Sagui 575", "precio": 8700.0, "img": "images/14325.jpg"}, {"ref": "12334", "nombre": "Corrector Miss Rouse", "precio": 8000.0, "img": "images/12334.jpg"}, {"ref": "10714", "nombre": "Gel Para Cejas", "precio": 23500.0, "img": "images/10714.jpg"}, {"ref": "11015", "nombre": "Balsamo De Cacao En Gol", "precio": 5000.0, "img": "images/11015.jpg"}, {"ref": "10180", "nombre": "Pañitos Pequeños Engol T-10", "precio": 3200.0, "img": "images/10180.jpg"}, {"ref": "10269", "nombre": "Prebase Elaya E019", "precio": 27500.0, "img": "images/10269.jpg"}, {"ref": "10945", "nombre": "Rubor Con Espejo Engol", "precio": 9400.0, "img": "images/10945.jpg"}, {"ref": "11693", "nombre": "Rubor Glam Engol", "precio": 14800.0, "img": "images/11693.jpg"}, {"ref": "12856", "nombre": "Agua De Rosas Sagui 60Ml", "precio": 10000.0, "img": "images/12856.jpg"}, {"ref": "10903", "nombre": "Polvo Compacto Myk-8032", "precio": 13800.0, "img": "images/10903.jpg"}, {"ref": "10368", "nombre": "Base Bb Cream Myk", "precio": 12600.0, "img": "images/10368.jpg"}, {"ref": "11683", "nombre": "Pestañina Prosa Negra", "precio": 20800.0, "img": "images/11683.jpg"}, {"ref": "14653", "nombre": "Set Encrespador Con Pomo", "precio": 9000.0, "img": "images/14653.jpg"}, {"ref": "14633", "nombre": "Rubor En Polvo Engol", "precio": 9500.0, "img": "images/14633.jpg"}, {"ref": "13570", "nombre": "Duo Rude Mini Gloss", "precio": 30000.0, "img": "images/13570.jpg"}, {"ref": "14427", "nombre": "Duo Bloom Bow Bloomshel", "precio": 28000.0, "img": "images/14427.jpg"}, {"ref": "14734", "nombre": "Lip Gloss Wardabeauty", "precio": 6000.0, "img": "images/14734.jpg"}, {"ref": "13881", "nombre": "Rubor Liquido Myk-6203", "precio": 24200.0, "img": "images/13881.jpg"}, {"ref": "11121", "nombre": "Hydratante De Fresa Bioaqua", "precio": 3600.0, "img": "images/11121.jpg"}, {"ref": "11421", "nombre": "Balsamo Hydratante Melocoton", "precio": 4000.0, "img": "images/11421.jpg"}, {"ref": "10389", "nombre": "Balsamo De Toronja Bioaqua", "precio": 4000.0, "img": "images/10389.jpg"}, {"ref": "13668", "nombre": "Balsamo Labial De Menta", "precio": 4000.0, "img": "images/13668.jpg"}, {"ref": "11684", "nombre": "Lip Oil Corazon Engol", "precio": 10000.0, "img": "images/11684.jpg"}, {"ref": "14627", "nombre": "Lip Oil Engol", "precio": 13600.0, "img": "images/14627.jpg"}, {"ref": "13659", "nombre": "Brillo Magico Kiss Glam", "precio": 7500.0, "img": "images/13659.jpg"}, {"ref": "14258", "nombre": "Tintas De Labios Hust", "precio": 6800.0, "img": "images/14258.jpg"}, {"ref": "14729", "nombre": "Humide Lapiz De Cejas", "precio": 25300.0, "img": "images/14729.jpg"}];
const fmt = n => '$' + Math.round(n).toLocaleString('es-CO');
const pmap = Object.fromEntries(PRODUCTS.map(p => [p.ref, p]));

/* ---------------- CART STATE (localStorage) ---------------- */
let cart = {};
try{ cart = JSON.parse(localStorage.getItem('mariael_cart') || '{}'); }catch(e){ cart = {}; }

function saveCart(){
  localStorage.setItem('mariael_cart', JSON.stringify(cart));
  updateCartBadge();
}
function cartCount(){
  return Object.values(cart).reduce((a,q)=>a+q,0);
}
function cartTotal(){
  return Object.entries(cart).reduce((sum,[ref,qty])=> sum + (pmap[ref]?.precio||0)*qty, 0);
}
function updateCartBadge(){
  const count = cartCount();
  const badge = document.getElementById('cartBadge');
  if(count>0){ badge.style.display='flex'; badge.textContent = count; }
  else{ badge.style.display='none'; }
}

/* ---------------- TOAST ---------------- */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ---------------- PRODUCT GRID ---------------- */
function renderProductCard(p){
  const qty = cart[p.ref] || 0;
  return `
    <div class="product-card">
      <img class="product-img" src="${p.img}" alt="${p.nombre}" loading="lazy">
      <div class="product-body">
        <div class="product-name">${p.nombre}</div>
        <div class="product-price">${fmt(p.precio)}</div>
        ${qty>0 ? `
          <div class="qty-stepper" data-ref="${p.ref}">
            <button class="qty-minus">−</button>
            <span>${qty} en el carrito</span>
            <button class="qty-plus">+</button>
          </div>
        ` : `
          <button class="add-btn" data-ref="${p.ref}">
            <svg viewBox="0 0 24 24"><path d="M11 9h2V6h3V4h-3V1h-2v3H8v2h3v3zm-4 9c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zM7.16 14h9.45c.75 0 1.41-.41 1.75-1.03L21.7 6H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63z"/></svg>
            Agregar
          </button>
        `}
      </div>
    </div>
  `;
}

function renderGrid(list){
  const grid = document.getElementById('grid');
  if(list.length===0){
    grid.innerHTML = `<div class="empty-state"><span class="heart">&#9825;</span>No se encontraron productos</div>`;
    return;
  }
  grid.innerHTML = list.map(renderProductCard).join('');
}

document.getElementById('grid').addEventListener('click', (e)=>{
  const addBtn = e.target.closest('.add-btn');
  if(addBtn){
    const ref = addBtn.dataset.ref;
    cart[ref] = (cart[ref]||0) + 1;
    saveCart();
    renderGrid(currentList());
    showToast('Producto agregado al carrito');
    return;
  }
  const minus = e.target.closest('.qty-minus');
  const plus = e.target.closest('.qty-plus');
  if(minus || plus){
    const ref = e.target.closest('.qty-stepper').dataset.ref;
    cart[ref] = (cart[ref]||0) + (plus ? 1 : -1);
    if(cart[ref]<=0) delete cart[ref];
    saveCart();
    renderGrid(currentList());
    renderCart();
  }
});

function currentList(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return PRODUCTS.filter(p=>p.nombre.toLowerCase().includes(q));
}

document.getElementById('searchInput').addEventListener('input', ()=> renderGrid(currentList()));

/* ---------------- CART DRAWER ---------------- */
const cartOverlay = document.getElementById('cartOverlay');
const cartDrawer = document.getElementById('cartDrawer');

function openCart(){
  cartOverlay.classList.add('show');
  cartDrawer.classList.add('show');
  renderCart();
}
function closeCartFn(){
  cartOverlay.classList.remove('show');
  cartDrawer.classList.remove('show');
}
document.getElementById('cartFab').addEventListener('click', openCart);
document.getElementById('closeCart').addEventListener('click', closeCartFn);
cartOverlay.addEventListener('click', closeCartFn);

function renderCart(){
  const body = document.getElementById('cartBody');
  const footer = document.getElementById('cartFooter');
  const entries = Object.entries(cart).filter(([ref,qty])=> qty>0 && pmap[ref]);

  if(entries.length===0){
    body.innerHTML = `<div class="cart-empty"><span class="heart">&#9825;</span>Tu carrito está vacío</div>`;
    footer.style.display = 'none';
    return;
  }

  body.innerHTML = entries.map(([ref,qty])=>{
    const p = pmap[ref];
    return `
      <div class="cart-item" data-ref="${ref}">
        <img src="${p.img}" alt="${p.nombre}">
        <div class="cart-item-info">
          <div class="cart-item-name">${p.nombre}</div>
          <div class="cart-item-price">${fmt(p.precio)}</div>
          <div class="cart-item-controls">
            <button class="cart-minus">−</button>
            <span>${qty}</span>
            <button class="cart-plus">+</button>
          </div>
        </div>
        <button class="remove-btn" title="Eliminar">
          <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7zm3-4h6l1 2h4v2H2V5h4l1-2z"/></svg>
        </button>
      </div>
    `;
  }).join('');

  footer.style.display = 'block';
  document.getElementById('cartTotal').textContent = fmt(cartTotal());
}

document.getElementById('cartBody').addEventListener('click', (e)=>{
  const item = e.target.closest('.cart-item');
  if(!item) return;
  const ref = item.dataset.ref;
  if(e.target.closest('.cart-minus')){
    cart[ref] -= 1;
    if(cart[ref]<=0) delete cart[ref];
  } else if(e.target.closest('.cart-plus')){
    cart[ref] += 1;
  } else if(e.target.closest('.remove-btn')){
    delete cart[ref];
  } else {
    return;
  }
  saveCart();
  renderCart();
  renderGrid(currentList());
});

/* ---------------- WOMPI CHECKOUT ---------------- */
function generateReference(){
  const ts = Date.now();
  const rand = Math.random().toString(36).slice(2,8).toUpperCase();
  return `MARIAEL-${ts}-${rand}`;
}

document.getElementById('payBtn').addEventListener('click', async ()=>{
  const total = cartTotal();
  if(total<=0){ showToast('Tu carrito está vacío'); return; }

  if(!WOMPI_PUBLIC_KEY || WOMPI_PUBLIC_KEY.includes('REEMPLAZA')){
    showToast('Falta configurar la llave pública de Wompi');
    return;
  }

  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const email = document.getElementById('custEmail').value.trim();

  const amountInCents = Math.round(total * 100);
  const reference = generateReference();
  const currency = 'COP';

  const config = {
    currency: currency,
    amountInCents: amountInCents,
    reference: reference,
    publicKey: WOMPI_PUBLIC_KEY,
    redirectUrl: window.location.href.split('?')[0],
  };
  if(email || name || phone){
    config.customerData = {};
    if(email) config.customerData.email = email;
    if(name) config.customerData.fullName = name;
    if(phone){
      config.customerData.phoneNumber = phone;
      config.customerData.phoneNumberPrefix = '+57';
    }
  }

  const payBtn = document.getElementById('payBtn');
  payBtn.disabled = true;
  payBtn.textContent = 'Preparando pago...';

  // Si hay API de firma configurada, pide la firma de integridad antes de abrir el widget
  if(WOMPI_SIGNATURE_API_URL && !WOMPI_SIGNATURE_API_URL.includes('REEMPLAZA')){
    try{
      const resp = await fetch(WOMPI_SIGNATURE_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reference, amountInCents, currency })
      });
      if(resp.ok){
        const data = await resp.json();
        if(data.signature) config.signature = data.signature;
      } else {
        console.warn('No se pudo obtener la firma de integridad, se continúa sin ella.');
      }
    }catch(err){
      console.warn('Error consultando la API de firma, se continúa sin ella.', err);
    }
  }

  payBtn.textContent = 'Abriendo pago...';

  try{
    const checkout = new WidgetCheckout(config);
    checkout.open(function(result){
      payBtn.disabled = false;
      payBtn.textContent = 'Pagar con Wompi';
      const tx = result.transaction;
      if(tx && tx.status === 'APPROVED'){
        cart = {};
        saveCart();
        renderCart();
        renderGrid(currentList());
        closeCartFn();
        showToast('¡Pago aprobado! Gracias por tu compra 💖');
      } else if(tx && tx.status === 'PENDING'){
        showToast('Tu pago está pendiente de confirmación');
      } else {
        showToast('El pago no se completó. Intenta de nuevo.');
      }
    });
  }catch(err){
    payBtn.disabled = false;
    payBtn.textContent = 'Pagar con Wompi';
    showToast('No se pudo abrir Wompi. Revisa la llave pública.');
    console.error(err);
  }
});
